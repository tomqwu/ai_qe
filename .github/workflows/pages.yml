name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install PDF verification dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Check complete narration and measured caption timing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m unittest discover -s tools -p "test_*narration.py"
          python -m unittest discover -s tools -p "test_captions_from_alignment.py"
          python tools/validate_narration.py --require-complete
      - name: Check economics, pilot gates and reference contracts
        run: |
          node --test tools/qe-model.test.cjs tools/pilot-decision.test.cjs tools/fintech-model.test.cjs
          node --test tools/readiness-model.test.cjs
          node tools/build_scenario_data.cjs --check
          python tools/validate_contracts.py
          node tools/build_architecture_demo.cjs --check
          python tools/verify_architecture_demo.py
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Index slide and dictionary anchors
        run: python tools/finalize_site.py _site
      - name: Browser navigation and viewport regression checks
        run: |
          mkdir -p /tmp/qe-preview
          ln -s "$GITHUB_WORKSPACE/_site" /tmp/qe-preview/ai_qe
          python -m http.server 61600 --bind 127.0.0.1 --directory /tmp/qe-preview > /tmp/qe-http.log 2>&1 &
          node tools/check_audio_focus.cjs
          node tools/architecture-demo/narration-test.cjs
          node tools/fintech-browser-test.cjs
          node tools/ai-adoption-browser-test.cjs
          node tools/check_narration.cjs
          node tools/check_recorded_narration.cjs
          node tools/check_presenter_notes.cjs
          node tools/check_flow_narration.cjs
          node tools/browser-smoke.cjs
          node tools/sales-navigation-test.cjs
          node tools/search-navigation-test.cjs
          node tools/readiness-browser-test.cjs
          node tools/modernization-browser-test.cjs
          node tools/fintech-evidence-browser-test.cjs
          node tools/visual-story-browser-test.cjs
          node tools/dictionary-test.cjs
          node tools/architecture-demo/browser-test.cjs
      - name: Check site links and search index
        run: python tools/verify_site.py _site
      - name: Check research provenance and briefing completeness
        run: python tools/verify_industry.py _site
      - name: Check publication agreement and PDF editions
        run: |
          python tools/verify_publication.py _site
          python tools/verify_fintech.py _site
          python -m unittest discover -s tools -p "test_release.py"
      - name: Check questionnaire fields and response ranges
        run: python tools/verify_pdf.py
      - name: Check QA-only publication scope
        run: python tools/verify_qe_scope.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare current publication assets and checksums
        run: python tools/prepare_release.py --output /tmp/ai-qe-release
      - name: Publish the GitHub release after deployment
        run: python tools/publish_release.py --package /tmp/ai-qe-release
        env:
          GH_TOKEN: ${{ github.token }}
