<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" class="research-diagram" role="img" aria-labelledby="execution-isolation-title"><title id="execution-isolation-title">Proposed execution zones separating agent orchestration, sandbox work and protected production</title><defs><marker id="execution-isolation-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
<rect x="20" y="20" width="350" height="370" rx="8" class="lane"/>
<text x="38" y="55" class="lane-title" text-anchor="start">AGENT ORCHESTRATION</text>
<rect x="425" y="20" width="350" height="370" rx="8" class="lane lane-teal"/>
<text x="443" y="55" class="lane-title" text-anchor="start">SANDBOX EXECUTION</text>
<rect x="830" y="20" width="350" height="370" rx="8" class="lane lane-sand"/>
<text x="848" y="55" class="lane-title" text-anchor="start">PROTECTED PRODUCTION</text>
<g class="diagram-node ">
<rect x="40" y="95" width="310" height="106" rx="8" class="node"/>
<text x="56" y="123" class="node-title" text-anchor="start">Runtime worker</text>
<text x="56" y="146" class="node-text" text-anchor="start">Bounded task and retry budget</text>
<text x="56" y="166" class="node-text" text-anchor="start">No production credentials</text>
</g>
<g class="diagram-node ">
<rect x="445" y="95" width="310" height="106" rx="8" class="node"/>
<text x="461" y="123" class="node-title" text-anchor="start">Ephemeral runner</text>
<text x="461" y="146" class="node-text" text-anchor="start">Task-scoped identity</text>
<text x="461" y="166" class="node-text" text-anchor="start">Synthetic / approved fixtures</text>
</g>
<g class="diagram-node ">
<rect x="850" y="95" width="310" height="106" rx="8" class="node"/>
<text x="866" y="123" class="node-title" text-anchor="start">Existing release systems</text>
<text x="866" y="146" class="node-text" text-anchor="start">Protected deployment identity</text>
<text x="866" y="166" class="node-text" text-anchor="start">Separate change authority</text>
</g>
<path d="M 350 148 H 443" class="edge" marker-end="url(#execution-isolation-arrow)"/>
<text x="371" y="133" class="edge-label" text-anchor="middle">allow</text>
<g class="diagram-node ">
<rect x="445" y="251" width="310" height="106" rx="8" class="node"/>
<text x="461" y="279" class="node-title" text-anchor="start">Controlled outputs</text>
<text x="461" y="302" class="node-text" text-anchor="start">Logs and test artifacts</text>
<text x="461" y="322" class="node-text" text-anchor="start">Redaction and retention rules</text>
</g>
<path d="M 600 201 V 249" class="edge" marker-end="url(#execution-isolation-arrow)"/>
<g class="diagram-node ">
<rect x="850" y="251" width="310" height="106" rx="8" class="node"/>
<text x="866" y="279" class="node-title" text-anchor="start">Reviewed artifact</text>
<text x="866" y="302" class="node-text" text-anchor="start">Signed or verified provenance</text>
<text x="866" y="322" class="node-text" text-anchor="start">Independent approval evidence</text>
</g>
<path d="M 755 303 H 848" class="edge" marker-end="url(#execution-isolation-arrow)"/>
<text x="790" y="287" class="edge-label" text-anchor="middle">review</text>
<path d="M 1005 251 V 203" class="edge" marker-end="url(#execution-isolation-arrow)"/>
<text x="40" y="276" class="node-title" text-anchor="start">Default-deny egress</text>
<text x="40" y="310" class="node-text" text-anchor="start">Explicit destinations and quotas</text>
<text x="40" y="338" class="node-text" text-anchor="start">Cleanup after every task</text>
<rect x="20" y="435" width="1160" height="52" rx="8" class="lane lane-teal"/>
<text x="40" y="468" class="node-text" text-anchor="start">Sandboxing limits consequences; it still needs access controls, escape tests and artifact validation.</text>
</svg>
