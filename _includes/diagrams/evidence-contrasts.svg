<text x="644" y="54" class="lane-title" text-anchor="start">METR / EARLY-2025 TRIAL</text>
<text x="44" y="120" class="big-stat" text-anchor="start">+26.08%</text>
<text x="44" y="159" class="label" text-anchor="start">completed tasks</text>
