<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" class="research-diagram" role="img" aria-labelledby="evidence-contrasts-title"><title id="evidence-contrasts-title">Two randomized-study findings measured different outcomes: a 26.08 percent increase in completed tasks in field experiments and a 19 percent increase in completion time in METR early-2025 study</title><defs><marker id="evidence-contrasts-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
