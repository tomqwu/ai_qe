<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" class="research-diagram" role="img" aria-labelledby="appsec-loop-title"><title id="appsec-loop-title">Application-security finding through reviewed remediation, with a separate dismissed-finding audit branch</title><defs><marker id="appsec-loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
<g class="diagram-node ">
<rect x="20" y="45" width="350" height="120" rx="8" class="node"/>
<text x="36" y="73" class="node-title" text-anchor="start">Scanner finding</text>
<text x="36" y="96" class="node-text" text-anchor="start">Trace + CWE + source hash</text>
<text x="36" y="116" class="node-text" text-anchor="start">No model-only discovery claim</text>
</g>
<g class="diagram-node ">
<rect x="420" y="45" width="350" height="120" rx="8" class="node node-teal"/>
<text x="436" y="73" class="node-title" text-anchor="start">Contextual triage</text>
<text x="436" y="96" class="node-text" text-anchor="start">Evidence + human disposition</text>
<text x="436" y="116" class="node-text" text-anchor="start">Never silently suppress</text>
</g>
<g class="diagram-node ">
<rect x="820" y="45" width="350" height="120" rx="8" class="node"/>
<text x="836" y="73" class="node-title" text-anchor="start">Draft remediation</text>
<text x="836" y="96" class="node-text" text-anchor="start">Reviewed patch proposal</text>
<text x="836" y="116" class="node-text" text-anchor="start">Least-privilege identity</text>
</g>
<path d="M 370 106 H 418" class="edge" marker-end="url(#appsec-loop-arrow)"/>
<path d="M 770 106 H 818" class="edge" marker-end="url(#appsec-loop-arrow)"/>
<g class="diagram-node ">
<rect x="820" y="270" width="350" height="125" rx="8" class="node"/>
<text x="836" y="298" class="node-title" text-anchor="start">Independent validation</text>
<text x="836" y="321" class="node-text" text-anchor="start">Rerun scanner + regression</text>
<text x="836" y="341" class="node-text" text-anchor="start">Exploit / negative case</text>
<text x="836" y="361" class="node-text" text-anchor="start">Owner approves existing PR gate</text>
</g>
<path d="M 994 165 V 268" class="edge" marker-end="url(#appsec-loop-arrow)"/>
<g class="diagram-node ">
<rect x="420" y="270" width="350" height="125" rx="8" class="node node-sand"/>
<text x="436" y="298" class="node-title" text-anchor="start">Dismissal audit</text>
<text x="436" y="321" class="node-text" text-anchor="start">Retain evidence and reason</text>
<text x="436" y="341" class="node-text" text-anchor="start">Sample dismissed findings</text>
<text x="436" y="361" class="node-text" text-anchor="start">Reopen missed true positives</text>
</g>
<path d="M 595 165 V 268" class="edge edge-dashed" marker-end="url(#appsec-loop-arrow)"/>
<text x="612" y="225" class="edge-label" text-anchor="start">if dismissed</text>
<g class="diagram-node ">
<rect x="20" y="270" width="350" height="125" rx="8" class="node"/>
<text x="36" y="298" class="node-title" text-anchor="start">Learning record</text>
<text x="36" y="321" class="node-text" text-anchor="start">Accepted fix / audited dismissal</text>
<text x="36" y="341" class="node-text" text-anchor="start">Outcome + reviewer + versions</text>
<text x="36" y="361" class="node-text" text-anchor="start">New case for next evaluation</text>
</g>
<path d="M 820 408 H 196 V 396" class="edge edge-dashed" marker-end="url(#appsec-loop-arrow)"/>
<path d="M 420 334 H 372" class="edge edge-dashed" marker-end="url(#appsec-loop-arrow)"/>
</svg>
