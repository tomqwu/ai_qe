<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" class="research-diagram" role="img" aria-labelledby="corpus-design-title"><title id="corpus-design-title">Proposed evaluation corpus lifecycle with separate development, held-out and adversarial case sets</title><defs><marker id="corpus-design-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
<g class="diagram-node ">
<rect x="20" y="60" width="280" height="141" rx="8" class="node"/>
<text x="36" y="88" class="node-title" text-anchor="start">Candidate cases</text>
<text x="36" y="111" class="node-text" text-anchor="start">User tasks and approved examples</text>
<text x="36" y="131" class="node-text" text-anchor="start">Reviewed production failures</text>
<text x="36" y="151" class="node-text" text-anchor="start">Synthetic edge cases</text>
</g>
<g class="diagram-node ">
<rect x="360" y="60" width="280" height="141" rx="8" class="node node-teal"/>
<text x="376" y="88" class="node-title" text-anchor="start">Curation and labeling</text>
<text x="376" y="111" class="node-text" text-anchor="start">Minimize sensitive content</text>
<text x="376" y="131" class="node-text" text-anchor="start">Deduplicate related cases</text>
<text x="376" y="151" class="node-text" text-anchor="start">Review expected behavior</text>
</g>
<path d="M 300 130 H 358" class="edge" marker-end="url(#corpus-design-arrow)"/>
<g class="diagram-node ">
<rect x="765" y="20" width="415" height="112" rx="8" class="node"/>
<text x="781" y="48" class="node-title" text-anchor="start">Development set</text>
<text x="781" y="71" class="node-text" text-anchor="start">Prompt iteration and debugging</text>
</g>
<path d="M 640 130 H 700 V 76 H 763" class="edge" marker-end="url(#corpus-design-arrow)"/>
<g class="diagram-node ">
<rect x="765" y="174" width="415" height="112" rx="8" class="node"/>
<text x="781" y="202" class="node-title" text-anchor="start">Held-out evaluation</text>
<text x="781" y="225" class="node-text" text-anchor="start">Release comparison; restrict tuning access</text>
</g>
<path d="M 640 130 H 700 V 230 H 763" class="edge" marker-end="url(#corpus-design-arrow)"/>
<g class="diagram-node ">
<rect x="765" y="328" width="415" height="112" rx="8" class="node node-sand"/>
<text x="781" y="356" class="node-title" text-anchor="start">Adversarial set</text>
<text x="781" y="379" class="node-text" text-anchor="start">Authority, disclosure and recovery scenarios</text>
</g>
<path d="M 640 130 H 700 V 384 H 763" class="edge" marker-end="url(#corpus-design-arrow)"/>
<text x="35" y="296" class="lane-title" text-anchor="start">SPLIT RELATED CASES TOGETHER</text>
<text x="35" y="334" class="label" text-anchor="start">Near duplicates can make a held-out result</text>
<text x="35" y="365" class="label" text-anchor="start">look more general than it is.</text>
<text x="35" y="481" class="small" text-anchor="start">Version each case, source permission, expectation, scenario tag and review decision. Report results by important slice.</text>
</svg>
