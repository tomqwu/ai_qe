<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" class="research-diagram" role="img" aria-labelledby="evaluation-system-title"><title id="evaluation-system-title">Proposed AI evaluation architecture with versioned application configurations, held-out cases, independent evaluation, release decisions, monitoring and feedback</title><defs><marker id="evaluation-system-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
<g class="diagram-node on-dark">
<rect x="20" y="20" width="298" height="103" rx="8" class="node node-navy"/>
<text x="36" y="48" class="node-title" text-anchor="start">Versioned application</text>
<text x="36" y="71" class="node-text" text-anchor="start">Model · prompt · retrieval</text>
<text x="36" y="91" class="node-text" text-anchor="start">Tools · permissions · memory</text>
</g>
<g class="diagram-node ">
<rect x="20" y="185" width="298" height="105" rx="8" class="node"/>
<text x="36" y="213" class="node-title" text-anchor="start">Evaluation corpus</text>
<text x="36" y="236" class="node-text" text-anchor="start">Representative + adversarial cases</text>
<text x="36" y="256" class="node-text" text-anchor="start">Held-out set · human labels</text>
</g>
<g class="diagram-node ">
<rect x="388" y="20" width="358" height="103" rx="8" class="node node-teal"/>
<text x="404" y="48" class="node-title" text-anchor="start">Baseline and candidate runs</text>
<text x="404" y="71" class="node-text" text-anchor="start">Same tasks and test conditions</text>
<text x="404" y="91" class="node-text" text-anchor="start">Record outputs AND tool actions</text>
</g>
<g class="diagram-node ">
<rect x="388" y="185" width="358" height="132" rx="8" class="node"/>
<text x="404" y="213" class="node-title" text-anchor="start">Independent scoring</text>
<text x="404" y="236" class="node-text" text-anchor="start">Deterministic contracts</text>
<text x="404" y="256" class="node-text" text-anchor="start">Calibrated judges + expert review</text>
<text x="404" y="276" class="node-text" text-anchor="start">Quality by scenario; cost and latency</text>
</g>
