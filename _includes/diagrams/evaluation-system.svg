<g class="diagram-node ">
<rect x="868" y="19" width="288" height="100" rx="8" class="node node-sand"/>
<text x="884" y="47" class="node-title" text-anchor="start">Hold + investigate</text>
<text x="884" y="70" class="node-text" text-anchor="start">Failed case → diagnosis</text>
<text x="884" y="90" class="node-text" text-anchor="start">Revise configuration or control</text>
</g>
<path d="M 978 167 V 121" class="edge edge-amber" marker-end="url(#evaluation-system-arrow)"/>
<text x="995" y="146" class="edge-label" text-anchor="start">no</text>
