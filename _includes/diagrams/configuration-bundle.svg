<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" class="research-diagram" role="img" aria-labelledby="configuration-bundle-title"><title id="configuration-bundle-title">Proposed versioned release bundle connecting application components and evaluation evidence</title><defs><marker id="configuration-bundle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#096d69" stroke-width="1.6"/></marker></defs>
<rect x="20" y="20" width="740" height="364" rx="8" class="lane"/>
<text x="40" y="53" class="lane-title" text-anchor="start">APPLICATION RELEASE MANIFEST</text>
<g class="diagram-node ">
<rect x="40" y="80" width="335" height="126" rx="8" class="node"/>
<text x="56" y="108" class="node-title" text-anchor="start">Model + prompt</text>
<text x="56" y="131" class="node-text" text-anchor="start">Provider / model revision</text>
<text x="56" y="151" class="node-text" text-anchor="start">System and task prompt IDs</text>
</g>
<g class="diagram-node ">
<rect x="405" y="80" width="335" height="126" rx="8" class="node"/>
<text x="421" y="108" class="node-title" text-anchor="start">Retrieval + data</text>
<text x="421" y="131" class="node-text" text-anchor="start">Index and source snapshot</text>
<text x="421" y="151" class="node-text" text-anchor="start">Corpus and access policy IDs</text>
</g>
<g class="diagram-node ">
<rect x="40" y="230" width="335" height="126" rx="8" class="node"/>
<text x="56" y="258" class="node-title" text-anchor="start">Tools + memory</text>
<text x="56" y="281" class="node-text" text-anchor="start">Schemas and allowed actions</text>
<text x="56" y="301" class="node-text" text-anchor="start">Memory rules and retention</text>
</g>
<g class="diagram-node ">
<rect x="405" y="230" width="335" height="126" rx="8" class="node"/>
<text x="421" y="258" class="node-title" text-anchor="start">Evaluation contract</text>
<text x="421" y="281" class="node-text" text-anchor="start">Dataset, rubric and judge versions</text>
<text x="421" y="301" class="node-text" text-anchor="start">Thresholds and scenario groups</text>
</g>
<g class="diagram-node ">
<rect x="860" y="118" width="320" height="156" rx="8" class="node node-teal"/>
<text x="876" y="146" class="node-title" text-anchor="start">Release identity</text>
<text x="876" y="169" class="node-text" text-anchor="start">Manifest hash + code commit</text>
<text x="876" y="189" class="node-text" text-anchor="start">Baseline and candidate run IDs</text>
<text x="876" y="209" class="node-text" text-anchor="start">Decision and approving owner</text>
</g>
<path d="M 760 196 H 858" class="edge" marker-end="url(#configuration-bundle-arrow)"/>
<rect x="20" y="425" width="1160" height="52" rx="8" class="lane lane-teal"/>
<text x="40" y="458" class="node-text" text-anchor="start">A material component change creates a new candidate and triggers the relevant evaluation suite.</text>
</svg>
