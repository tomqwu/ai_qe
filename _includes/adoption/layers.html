{% assign model = site.data.ai_adoption %}
<figure class="al-map" aria-label="Four adoption layers with shared foundations">
  <ol class="al-levels">
  {% for layer in model.layers %}<li class="al-level al-level-{{ layer.number }}">
    <a href="{% if include.slide %}{{ '/ai-adoption/' | relative_url }}{% endif %}#layer-{{ layer.id }}"{% unless include.slide %} data-al-select="{{ layer.id }}" aria-controls="layer-{{ layer.id }}"{% endunless %}>
      <span class="al-number">{{ layer.number }}</span><span class="al-verb">{{ layer.verb }}</span>
      <strong>{{ layer.title }}</strong><span class="al-example">{{ layer.example_short }}</span>
      <span class="al-gate"><b>Proof to expand</b>{{ layer.gate_short }}</span>
    </a>
  </li>{% endfor %}
  </ol>
  <div class="al-foundation"><strong>Shared foundations · start on day one</strong><span>Context · data · reliable tests · CI · QE modernization · owners</span></div>
  <figcaption>Layer 4 supports layers 1–3. Scale useful assistance without having to delegate more actions.</figcaption>
</figure>
