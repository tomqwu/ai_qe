{% assign baseline = 0 %}{% for stage in site.data.fintech_case.workflow %}{% assign baseline = baseline | plus: stage.baseline %}{% endfor %}
<figure class="ft-effort"><div class="ft-effort-bars">{% for stage in site.data.fintech_case.workflow %}<div><span>{{ stage.title }}</span><div><i style="width:{{ stage.baseline | times: 100.0 | divided_by: 80 }}%"></i></div><b>{{ stage.baseline }}h</b></div>{% endfor %}</div><figcaption>{{ baseline }} person-hours for this pack. Each activity belongs to one stage. Baseline already includes its ordinary review and rework.</figcaption></figure>
