 target</h3><p>AI draft + human review → pinned CI runner → isolated payment service and PostgreSQL. Versioned WireMock models reproduce faults; raw assertions and run IDs are retained.</p></section></div><figcaption><strong>Target:</strong> virtualized service tests reduce dependence on vendor slots. Real-provider and settlement checks remain separate gates.</figcaption></figure>
