{% assign timing = site.data.visual_story.pilot_time %}
<figure class="ft-pilot-time" aria-label="API pilot time observation framework">
  <p class="ft-time-status">{{ timing.status }}</p>
  <ol class="ft-roadmap">{% for phase in timing.phases %}<li><span>{{ phase.window }}</span><h3>{{ phase.title }}</h3><p>{{ phase.observe }}</p><b>Evidence gate: {{ phase.gate }}</b></li>{% endfor %}</ol>
  <figcaption>{{ timing.record }}</figcaption>
</figure>
