<figure class="vs-lifecycle" data-vs-lifecycle><p class="vs-caption">Proposed execution lifecycle. Numbered steps show order, not elapsed time.</p><ol>{% for step in site.data.visual_story.lifecycle %}<li data-vs-life-step><b>{{ forloop.index }}</b><div><strong>{{ step.title }}</strong><span>{{ step.detail }}</span></div></li>{% endfor %}</ol>
<div class="vs-controls" data-vs-life-controls hidden><label>Demonstration outcome<select data-vs-life-outcome><option value="pass">Required checks pass</option><option value="test-failure">Payment assertion fails</option><option value="setup-failure">Environment setup fails</option></select></label><button type="button" data-vs-life-next>Next step →</button><button type="button" data-vs-life-reset>Overview</button></div><p class="vs-life-status" data-vs-life-status role="status" aria-live="polite">Evidence survives cleanup. A missing or failed required check holds the release.</p>
<figcaption>CI owns execution and teardown; AI may draft a diagnostic summary. Test failures retain original assertions; setup failures retain diagnostics and skip execution. A failed cleanup needs an owner and escalation. Separate scheduled provider checks detect drift in the virtual-service model. <a href="{{ '/qe-modernization/#evidence' | relative_url }}">Technical sources and assumptions</a>.</figcaption></figure>
