<figure class="mod-distinctions"><div><article><span class="mod-number">RUN</span><h3>Containerization</h3><p>Package and run real software with repeatable dependencies.</p><strong>Example</strong><p>A PostgreSQL instance created for one test run.</p></article><article><span class="mod-number">SIMULATE</span><h3>Service virtualization</h3><p>Replace selected dependency behavior with a controlled model.</p><strong>Example</strong><p>A WireMock provider with an intentional timeout.</p></article><article><span class="mod-number">CHECK</span><h3>Contract testing</h3><p>Check whether consumer and provider interactions agree.</p><strong>Example</strong><p>A provider change fails a reviewed Pact contract.</p></article></div><figcaption>These capabilities complement each other. They do not establish complete business correctness or replace all real integration checks. <a href="{{ '/qe-modernization/#technology' | relative_url }}">Technology choices and limitations</a></figcaption></figure>
