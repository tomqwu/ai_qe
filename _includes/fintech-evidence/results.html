<figure class="fe-results"><div class="fe-result-grid">{% for item in site.data.fintech_evidence.featured %}<article><p class="fe-overline">{{ item.name }}</p><h3>{{ item.headline }}</h3><p class="fe-metric">{{ item.metric }}<small>{{ item.unit }}</small></p><div class="fe-bars" role="img" aria-label="{{ item.name }}: {{ item.before_label }} {{ item.before }}, {{ item.after_label }} {{ item.after }}. {{ item.unit }}."><div><span>{{ item.before_label }} <b>{{ item.before }}</b></span><i style="--value:{{ item.before }}%" data-fe-value="{{ item.before }}"></i></div><div><span>{{ item.after_label }} <b>{{ item.after }}</b></span><i style="--value:{{ item.after }}%" data-fe-value="{{ item.after }}"></i></div><div class="fe-axis"><span>0</span><span>100</span></div></div><p class="fe-chart-note">{{ item.caveat }} <a href="{{ '/case-studies/fintech/evidence/#case-' | append: item.case | relative_url }}">{{ item.source }}</a></p></article>{% endfor %}</div><figcaption>Separate outcomes and denominators. Each panel has its own meaning; no combined savings rate is calculated.</figcaption></figure>
