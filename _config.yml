title: AI-QE & AppSec
description: >-
  Strategic vision, delivery architecture and an inspectable evidence base for AI-assisted
  quality engineering and application security in regulated financial services.
baseurl: "/ai_qe"
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default
url: "https://tomqwu.github.io"

remote_theme: just-the-docs/just-the-docs@9c8baebfe4413de430b66884c1a9da893ee236bc
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
footer_content: >-
  Research for AI-assisted QE and AppSec. Sources and verification dates are recorded on each
  research page. Regulatory summaries are not legal advice.
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"
nav_sort: case_insensitive
aux_links:
  "Repository": "https://github.com/tomqwu/ai_qe"
aux_links_new_tab: true
callouts:
  note:
    title: Note
    color: blue
  caution:
    title: Caution
    color: yellow
  evidence:
    title: Evidence quality
    color: purple
mermaid:
  version: "10.9.1"
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - tools/
  - README.md
  - research
  - node_modules/
  - Claude outputs/
  - _to_delete/
  - _incoming/
