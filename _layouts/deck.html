<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/source-sans-3.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/decks.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/explorers.css' | relative_url }}">
  <script src="{{ '/assets/js/decks.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/qe-model.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/explorers.js' | relative_url }}" defer></script>
  <link rel="stylesheet" href="{{ "/assets/css/industry.css" | relative_url }}">
  <script src="{{ "/assets/js/industry.js" | relative_url }}" defer></script>
<link rel="stylesheet" href="{{ '/assets/css/diagrams.css' | relative_url }}">
<script src="{{ '/assets/js/diagrams.js' | relative_url }}" defer></script>
</head>
<body class="deck-page {{ page.deck_class }}">
  <a class="skip-link" href="#slides">Skip to slides</a>
  <header class="deck-header">
    <a href="{{ '/' | relative_url }}" target="_top" class="deck-brand">AI-QE <span>&amp; AppSec</span></a>
    <span class="deck-audience">{{ page.audience }}</span>
    <div class="deck-tools" hidden><button type="button" data-reading aria-pressed="false">Read all</button><button type="button" data-fullscreen>Present ↗</button></div>
  </header>
  <main id="slides" class="slides" aria-label="{{ page.title }}" tabindex="-1"><h1 class="sr-only">{{ page.title }}</h1>{{ content }}</main>
  <nav class="deck-navigation" aria-label="Slide navigation" hidden>
    <div class="deck-nav-controls"><button type="button" data-previous aria-label="Previous slide">←</button><button type="button" data-next aria-label="Next slide">→</button></div>
    <p class="slide-status" aria-live="polite" aria-atomic="true"></p>
    <label class="slide-picker-label">Go to slide <select aria-label="Go to slide"></select></label>
  </nav>
  <p class="deck-message" role="status"></p>
  <noscript><p class="no-script">All slides are shown in reading order. Use your browser’s print command to save a copy.</p></noscript>
</body>
</html>
